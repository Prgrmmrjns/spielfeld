[project]
name = "spielfeld"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0",
  "requests>=2.32.0",
  "httpx>=0.27.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python scripts/refresh_lineups.py || true"
