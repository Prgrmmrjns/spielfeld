name: Refresh Bundesliga predictions

on:
  workflow_dispatch:
  schedule:
    # After typical Bundesliga kickoffs, plus a morning catch-up. Exits if the table is current.
    - cron: '20 6 * * *'
    - cron: '30 21 * * 5'
    - cron: '30 16,19 * * 6,0'
    - cron: '30 20 * * 1'
  push:
    branches: [main]
    paths:
      - 'predict.py'
      - 'xi_table.py'
      - 'xi_model.py'
      - 'api_football.py'
      - '.github/workflows/refresh-predictions.yml'

concurrency:
  group: refresh-predictions
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ml.txt

      - name: Restore API-Football cache
        uses: actions/cache@v4
        with:
          path: api_football_cache.json
          key: api-football-cache-${{ github.run_id }}
          restore-keys: |
            api-football-cache-

      - name: Run best-XI predictions (TabPFN 3.5)
        env:
          TABPFN_API_KEY: ${{ secrets.TABPFN_API_KEY }}
          TABPFN_TOKEN: ${{ secrets.TABPFN_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TABPFN_NO_BROWSER: '1'
          AF_LINEUP_FETCHES: '30'
          AF_FETCH_PLAYER_STATS: '1'
        run: python predict.py

      - name: Commit updated predictions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/data/predictions.json public/data/predictions.json public/explanations \
            data/xi_matches.csv data/xi_players.csv data/lineups.json data/last_sides.json || true
          if git diff --staged --quiet; then
            echo 'No prediction changes'
          else
            git commit -m "chore: append matchday XI rows and refit TabPFN"
            git push
          fi
